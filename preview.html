<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GastroGo - Eszköz Emulátor</title>
    <style>
        :root {
            --emulator-bg: #0F172A;
            --control-panel-bg: #1E293B;
            --border-color: #334155;
            --text-color: #E2E8F0;
            --accent: #FF9F1C;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--emulator-bg);
            color: var(--text-color);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ================= EMULATOR CONTROLS ================= */
        .header-controls {
            background-color: var(--control-panel-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }

        .logo-area h1 {
            font-size: 18px;
            font-weight: 700;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-area span {
            color: var(--accent);
            font-size: 12px;
            background: rgba(255, 159, 28, 0.15);
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 600;
        }

        .controls-group {
            display: flex;
            gap: 12px;
        }

        .btn-control {
            background: #2D3748;
            color: #E2E8F0;
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-control:hover {
            background: #4A5568;
            color: white;
        }

        .btn-control.active {
            background: var(--accent);
            color: #000000;
            border-color: var(--accent);
        }

        /* ================= DEVICE DISPLAY FIELD ================= */
        .emulator-stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* ================= IOS PHONE FRAME ================= */
        .phone-mockup {
            position: relative;
            background: #111;
            border-radius: 48px;
            box-shadow: 0 25px 60px -10px rgba(0, 0, 0, 0.7);
            border: 12px solid #222;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* IOS Profile */
        .phone-mockup.ios {
            width: 390px;
            height: 800px;
            border-radius: 50px;
            border: 14px solid #1c1c1e;
        }

        /* Android Profile */
        .phone-mockup.android {
            width: 400px;
            height: 820px;
            border-radius: 36px;
            border: 12px solid #2d2d2d;
        }

        /* Interactive Speaker & Camera Details */
        .phone-mockup::before {
            content: '';
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            height: 28px;
            background: #000;
            z-index: 100;
            transition: all 0.3s ease;
        }

        /* iOS Dynamic Island / Notch */
        .phone-mockup.ios::before {
            width: 110px;
            border-radius: 14px;
            top: 10px;
        }

        /* Android punch hole */
        .phone-mockup.android::before {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            top: 12px;
            background: #111;
            border: 2px solid #333;
        }

        /* Device status bar simulation */
        .status-bar {
            height: 38px;
            background-color: #FFFFFF;
            color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 24px;
            font-size: 12px;
            font-weight: 600;
            z-index: 99;
            user-select: none;
        }

        .phone-mockup.android .status-bar {
            background-color: #FFFFFF;
            color: #000000;
            height: 34px;
            padding: 0 16px;
            font-family: Roboto, sans-serif;
        }

        .status-bar-icons {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Application iframe */
        .emulator-iframe {
            flex: 1;
            width: 100%;
            border: none;
            background-color: white;
        }

        /* iOS Bottom Home Indicator */
        .home-indicator {
            height: 24px;
            background-color: #FFFFFF;
            position: relative;
            z-index: 99;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .home-indicator::after {
            content: '';
            width: 130px;
            height: 5px;
            background-color: #000000;
            border-radius: 3px;
        }

        /* Android Bottom Soft Keys */
        .android-navigation-bar {
            height: 40px;
            background-color: #000000;
            display: none;
            justify-content: space-around;
            align-items: center;
            z-index: 99;
        }

        .phone-mockup.android .android-navigation-bar {
            display: flex;
        }

        .phone-mockup.android .home-indicator {
            display: none;
        }

        .nav-key {
            width: 16px;
            height: 16px;
            border: 2px solid #FFF;
            opacity: 0.7;
        }

        .nav-key.back {
            border: none;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 12px solid #FFF;
        }

        .nav-key.home {
            border-radius: 50%;
        }

        .nav-key.recent {
            border-radius: 3px;
        }

        /* Side physical buttons graphic */
        .phone-mockup::after {
            content: '';
            position: absolute;
            width: 4px;
            background: #333;
            left: -16px;
            top: 100px;
            height: 50px;
            border-radius: 4px 0 0 4px;
            box-shadow: 0 60px 0 #333, 0 120px 0 #333;
        }
    </style>
</head>
<body>

    <!-- ================= EMULATOR HEADER CONTROLS ================= -->
    <div class="header-controls">
        <div class="logo-area">
            <h1>GastroGo Emulator <span>v1.0</span></h1>
        </div>
        <div class="controls-group">
            <button id="btn-ios" class="btn-control active">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M18.71,19.5C17.88,20.74,17,21.95,15.66,22c-1.34,.05-1.77-.77-3.29-.77c-1.53,0-2,.75-3.27,.8c-1.31,.05-2.3-1.32-3.14-2.53C4.25,17,2.94,12.45,4.7,9.39c.87-1.52,2.43-2.48,4.12-2.51c1.28-.02,2.5,.87,3.29,.87c.78,0,2.26-1.07,3.81-.91c.65,.03,2.47,.26,3.64,1.98c-.09,.06-2.17,1.28-2.15,3.81c.03,3.02,2.65,4.03,2.68,4.04C20.03,16.59,19.56,18.25,18.71,19.5M15.97,4.17c.66-.81,1.11-1.93,.99-3.06c-1,.04-2.21,.67-2.93,1.51c-.62,.72-1.16,1.86-1.01,2.98c1.12,.09,2.26-.62,2.95-1.43Z"/>
                </svg>
                Apple iOS Preview
            </button>
            <button id="btn-android" class="btn-control">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path d="M17.5,7A1,1,0,0,1,18.5,8v7a1,1,0,0,1-2,0V8A1,1,0,0,1,17.5,7ZM6.5,7A1,1,0,0,1,7.5,8v7a1,1,0,0,1-2,0V8A1,1,0,0,1,6.5,7ZM12,2a10,10,0,0,0-7.3,3.1L3.3,3.7A1,1,0,0,0,1.9,5.1l1.5,1.5A10,10,0,0,0,12,22a10,10,0,0,0,8.6-15.4l1.5-1.5a1,1,0,0,0-1.4-1.4L19.3,5.1A10,10,0,0,0,12,2ZM12,20a8,8,0,1,1,8-8A8,8,0,0,1,12,20Z"/>
                </svg>
                Android Preview
            </button>
            <button id="btn-reload" class="btn-control">
                🔄 Újratöltés
            </button>
        </div>
    </div>

    <!-- ================= STAGE WITH MOCKUP ================= -->
    <div class="emulator-stage">
        <div class="phone-mockup ios" id="device-mockup">
            <!-- Simulated Native Status Bar -->
            <div class="status-bar" id="device-status-bar">
                <span id="status-time">16:13</span>
                <div class="status-bar-icons">
                    <!-- Wifi icon SVG -->
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 21l-12-12c2.7-2.7 6.3-4.3 10.3-4.3s7.6 1.6 10.3 4.3l-8.6 8.6c-.6-.4-1.2-.6-2-.6s-1.4.2-2 .6z"/>
                    </svg>
                    <!-- Battery icon SVG -->
                    <svg width="18" height="12" viewBox="0 0 24 12" fill="currentColor">
                        <rect x="0" y="0" width="20" height="12" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
                        <rect x="2" y="2" width="13" height="8" rx="1.5"/>
                        <path d="M21,3 L21,9" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                    </svg>
                </div>
            </div>

            <!-- Iframe running the app -->
                <iframe class="emulator-iframe" id="app-iframe" src="order.html?v=78"></iframe>

            <!-- iOS Bottom Bar -->
            <div class="home-indicator" id="ios-home"></div>

            <!-- Android Navigation Bar (visible only in Android mode) -->
            <div class="android-navigation-bar" id="android-nav">
                <div class="nav-key back"></div>
                <div class="nav-key home"></div>
                <div class="nav-key recent"></div>
            </div>
        </div>
    </div>

    <script>
        const mockup = document.getElementById("device-mockup");
        const appIframe = document.getElementById("app-iframe");
        const btnIos = document.getElementById("btn-ios");
        const btnAndroid = document.getElementById("btn-android");
        const btnReload = document.getElementById("btn-reload");
        const statusTime = document.getElementById("status-time");

        // Set live time in status bar
        function updateTime() {
            const now = new Date();
            const hrs = String(now.getHours()).padStart(2, '0');
            const mins = String(now.getMinutes()).padStart(2, '0');
            statusTime.textContent = `${hrs}:${mins}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // Switch to iOS
        btnIos.addEventListener("click", () => {
            mockup.classList.remove("android");
            mockup.classList.add("ios");
            btnAndroid.classList.remove("active");
            btnIos.classList.add("active");
        });

        // Switch to Android
        btnAndroid.addEventListener("click", () => {
            mockup.classList.remove("ios");
            mockup.classList.add("android");
            btnIos.classList.remove("active");
            btnAndroid.classList.add("active");
        });

        // Reload iframe
        btnReload.addEventListener("click", () => {
            appIframe.contentWindow.location.reload();
        });
    </script>
</body>
</html>
